[project]
name = "knowanswer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0",
    "docx2txt>=0.9",
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface>=1.2.3",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-embeddings-langchain>=0.6.0",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-milvus>=1.2.0",
    "pydantic-settings>=2.0",
    "pymilvus>=2.6.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/know_answer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
